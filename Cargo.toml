[package]
name = "d2r-audio-mod"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Lightweight D2R audio telemetry Mod generator and processor"

[[bin]]
name = "d2r-audio-mod"
path = "src/main.rs"

[dependencies]
d2r-audio-protocol = { path = "crates/d2r-audio-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1.3.1"
uuid = { version = "1", features = ["v4"] }
claxon = "0.4.3"
flacenc = { version = "0.5.1", default-features = false }
casc-core = { git = "https://github.com/TrayHard/casc-modern.git", rev = "a7fe4095f4ce445b9135b26509c5f60ae63d8c21" }

[target.'cfg(windows)'.dependencies]
junction = { version = "2.0.0", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
